[project]
name = "talk-to-your-building"
version = "0.1.0"
description = "Talk to Your Building: agent-first indoor navigation (Industrial Agents Hackathon 2026, Track 01)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.2",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
run_benchmark = "agent.run_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent", "benchmark", "backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
