# Weekly dependency updates (docs/guides/ci-cd.md); each PR runs CI and gets a Vercel preview.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend/app
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
